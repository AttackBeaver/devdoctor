[tool.poetry]
name = "devdoctor"
version = "0.2.0"
description = "Professional CLI tool for developer environment diagnostics and auto-fixing"
authors = ["YOUR_NAME <YOUR_EMAIL@example.com>"]
readme = "README.md"
homepage = "https://github.com/YOUR_GITHUB_USER/devdoctor"
repository = "https://github.com/YOUR_GITHUB_USER/devdoctor"
documentation = "https://YOUR_GITHUB_USER.github.io/devdoctor"
keywords = ["cli", "devops", "environment", "setup", "diagnostics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
packages = [{include = "devdoctor", from = "src"}]

[tool.poetry.dependencies]
python = "^3.9"
click = "^8.1.7"
rich = "^13.7.0"
pyyaml = "^6.0.1"
psutil = "^5.9.8"
openai = {version = "^1.12.0", optional = true}

[tool.poetry.extras]
ai = ["openai"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-mock = "^3.12.0"
black = "^24.2.0"
isort = "^5.13.2"
flake8 = "^7.0.0"
mypy = "^1.8.0"
pre-commit = "^3.6.1"
types-psutil = "^5.9.5.20240205"
types-PyYAML = "^6.0.12.12"
mkdocs = "^1.5.3"
mkdocs-material = "^9.5.10"

[tool.poetry.scripts]
devdoctor = "devdoctor.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
